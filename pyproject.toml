[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "vela"
version = "1.0.0"
description = "Vela — a Japanese-oriented Windows desktop video downloader built with PySide6 and yt-dlp"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vela contributors" }]
keywords = ["yt-dlp", "video", "downloader", "pyside6", "desktop"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "PySide6>=6.8,<7",
    "yt-dlp>=2024.12.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "pillow>=11",
    "pyinstaller>=6.10",
    "ruff>=0.15",
]

[project.gui-scripts]
vela = "vela.app:main"

[project.urls]
Homepage = "https://github.com/gabigos/vela"
Repository = "https://github.com/gabigos/vela"
Issues = "https://github.com/gabigos/vela/issues"

[tool.setuptools.packages.find]
include = ["vela*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "-ra"
markers = [
    "integration: exercises a real local HTTP download",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
